aid: lightship
name: Lightship
description: Lightship is an American manufacturer of all-electric travel trailers, co-founded
  by former Tesla leaders Toby Kraus and Ben Parker, with design and manufacturing in Colorado
  and offices in San Francisco. Its flagship product, the AE.1, is marketed as the first
  mass-produced all-electric travel trailer, offering up to 77 kWh of battery capacity, 1.8 kW
  of integrated solar, and named technologies including TrekDrive self-propulsion, CampQuiet
  silent operation, and Aero-Electric Design. Owners control the trailer through an onboard
  Atlas tablet and companion mobile app. Lightship sells direct to consumer and states that
  more than 85% of its supply chain is in the United States. Enrichment probes on 2026-07-19
  found no public API, developer portal, SDK, or /.well-known/ discovery surface; this is a
  company record in the API Evangelist network rather than an API listing.
